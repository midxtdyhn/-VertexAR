version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vertexar_backend
    restart: always
    ports:
      - "8001:8000"
    env_file:
      - ./backend/.env
      - ./.env
    environment:
      - APP_NAME=VertexAR API
      - APP_ENV=production
      - FRONTEND_ORIGIN=https://vertexar.my.id,https://www.vertexar.my.id,https://vertex-ar.vercel.app
      - DATABASE_URL=sqlite:///./vertexar.db
      - UPLOAD_DIR=uploads
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
    volumes:
      - ./backend/vertexar.db:/app/vertexar.db
      - ./backend/uploads:/app/uploads
      - ./backend/seed_questions.py:/app/seed_questions.py
      - ./backend/.env:/app/.env
    networks:
      - vertexar_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.vertexar.my.id}
    container_name: vertexar_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - vertexar_net

networks:
  vertexar_net:
    driver: bridge
